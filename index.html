<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Deals Radar</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="index.html" aria-label="Game Deals Radar — на главную">
        <span class="site-logo__mark" aria-hidden="true">G</span>
        <span class="site-logo__text">Game Deals <strong>Radar</strong></span>
      </a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="#filters">Фильтры</a></li>
          <li><a class="site-nav__link" href="#catalog">Каталог</a></li>
          <li><a class="site-nav__link" href="#about">О сервисе</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page-main">
    <section class="hero" aria-labelledby="page-title">
      <p class="hero__eyebrow">Скидки под контролем</p>
      <h1 id="page-title">Лучшие скидки на игры</h1>
      <p class="hero__lead">Ищите выгодные предложения и сравнивайте цены в удобной валюте.</p>
    </section>

    <section class="filters" id="filters" aria-labelledby="filters-title">
      <h2 id="filters-title">Фильтры</h2>

      <form class="filters__form" action="#catalog" method="get">
        <div class="form-field">
          <label for="game-search">Поиск по названию</label>
          <input
            class="form-control"
            id="game-search"
            name="query"
            type="search"
            placeholder="Например, Hades"
          >
        </div>

        <div class="form-field">
          <label for="currency">Валюта</label>
          <select class="form-control" id="currency" name="currency">
            <option value="pln">PLN — польский злотый</option>
            <option value="uah">UAH — украинская гривна</option>
            <option value="eur">EUR — евро</option>
            <option value="usd">USD — доллар США</option>
          </select>
        </div>

        <button class="button filters__submit" type="submit">Найти предложения</button>
      </form>
    </section>

    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Каталог предложений</h2>
      <p class="catalog__status" id="results-status" aria-live="polite"></p>

      <div class="deals-grid"></div>
    </section>

    <section class="about" id="about" aria-labelledby="about-title">
      <h2 id="about-title">О сервисе</h2>
      <p>Game Deals Radar помогает находить скидки на игры в одном месте.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="container site-footer__inner">&copy; 2026 Game Deals Radar</p>
  </footer>
</body>
</html>
